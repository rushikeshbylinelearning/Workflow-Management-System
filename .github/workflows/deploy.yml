name: Deploy

on:
  push:
    branches:
      - staging
      # Uncomment after GitHub production secrets are set and you want auto-deploy on main:
      # - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      bootstrap_db:
        description: Staging only — create schema on an empty database
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging (Hostinger)
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      APP_URL: ${{ vars.APP_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for staging
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SSO_DASHBOARD_URL: ${{ vars.SSO_DASHBOARD_URL }}
          VITE_ENABLE_RESUBMISSION_DEADLINE: ${{ vars.VITE_ENABLE_RESUBMISSION_DEADLINE || 'true' }}
          VITE_ENABLE_REWORK_HIGHLIGHT: ${{ vars.VITE_ENABLE_REWORK_HIGHLIGHT || 'true' }}

      - name: Require staging secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          APP_URL: ${{ vars.APP_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH BACKEND_ENV APP_URL API_URL; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set on the staging GitHub Environment"
              missing=1
            fi
          done
          exit $missing

      - name: Write staging backend .env from secret
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s\n' "$BACKEND_ENV" > /tmp/staging.backend.env

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-65002}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Upload files to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"
          $SSH "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/backend' '${DEPLOY_PATH}/dist' '${DEPLOY_PATH}/backend/logs' '${DEPLOY_PATH}/backend/uploads'"

          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude logs \
            --exclude uploads \
            -e "$SSH" \
            backend/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/"

          rsync -az --delete \
            -e "$SSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/dist/"

          rsync -az \
            -e "$SSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

          rsync -az \
            -e "$SSH" \
            deploy/htaccess.staging "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.htaccess"

          rsync -az \
            -e "$SSH" \
            /tmp/staging.backend.env "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/.env"

          rsync -az \
            -e "$SSH" \
            deploy/remote-after-deploy.sh "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/remote-after-deploy.sh"

      - name: Install, migrate, restart staging
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "PROCESS_MANAGER='${{ secrets.PROCESS_MANAGER }}' \
             PM2_APP_NAME='${{ secrets.PM2_APP_NAME }}' \
             BOOTSTRAP_DB='${{ github.event.inputs.bootstrap_db || false }}' \
             bash '${DEPLOY_PATH}/backend/remote-after-deploy.sh' '${DEPLOY_PATH}'"

      - name: Health check
        run: |
          API_URL="${{ vars.API_URL }}"
          echo "Checking ${API_URL}/health"
          for i in 1 2 3 4 5; do
            if curl -fsS "${API_URL}/health"; then
              echo
              echo "Staging health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Health check did not pass yet. Finish Hostinger Node.js setup, then re-run."
          exit 1

  production:
    name: Deploy production (A2 / PM2)
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SSO_DASHBOARD_URL: ${{ vars.SSO_DASHBOARD_URL }}
          VITE_ENABLE_RESUBMISSION_DEADLINE: ${{ vars.VITE_ENABLE_RESUBMISSION_DEADLINE || 'true' }}
          VITE_ENABLE_REWORK_HIGHLIGHT: ${{ vars.VITE_ENABLE_REWORK_HIGHLIGHT || 'true' }}

      - name: Require production secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_URL: ${{ vars.APP_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH APP_URL API_URL; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set on the production GitHub Environment"
              missing=1
            fi
          done
          exit $missing

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Upload files to A2 (keep live .env / uploads)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"
          $SSH "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/backend' '${DEPLOY_PATH}/dist' '${DEPLOY_PATH}/backend/logs' '${DEPLOY_PATH}/backend/uploads'"

          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude logs \
            --exclude uploads \
            -e "$SSH" \
            backend/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/"

          rsync -az --delete \
            -e "$SSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/dist/"

          rsync -az \
            -e "$SSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

          rsync -az \
            -e "$SSH" \
            deploy/htaccess.production "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.htaccess"

          rsync -az \
            -e "$SSH" \
            deploy/remote-after-deploy.sh "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/remote-after-deploy.sh"

      - name: Install dependencies and reload PM2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "PROCESS_MANAGER='${{ secrets.PROCESS_MANAGER }}' \
             PM2_APP_NAME='${{ secrets.PM2_APP_NAME }}' \
             BOOTSTRAP_DB='false' \
             bash '${DEPLOY_PATH}/backend/remote-after-deploy.sh' '${DEPLOY_PATH}'"

      - name: Health check
        run: |
          API_URL="${{ vars.API_URL }}"
          echo "Checking ${API_URL}/health"
          curl -fsS "${API_URL}/health"
          echo
          echo "Production health check passed"
