name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://workflow.bylinelms.com/api
          VITE_SSO_DASHBOARD_URL: https://sso.bylinelms.com/dashboard
          VITE_ENABLE_RESUBMISSION_DEADLINE: "true"
          VITE_ENABLE_REWORK_HIGHLIGHT: "true"

  backend:
    name: Backend install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server entry
        run: node --check server.js

  # Live site: A2 Hosting + PM2 (workflow.bylinelms.com)
  # Uses GitHub Environment "production" secrets you already configured.
  deploy-production:
    name: Deploy production (A2 / PM2)
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment.url cannot reference secrets (GitHub rejects the workflow file)
    environment:
      name: production
      url: https://workflow.bylinelms.com
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      # Your APP_URL / API_URL are Environment secrets (not Variables)
      APP_URL: ${{ secrets.APP_URL }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production (A2)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_SSO_DASHBOARD_URL: ${{ secrets.SSO_DASHBOARD_URL || 'https://sso.bylinelms.com/dashboard' }}
          VITE_ENABLE_RESUBMISSION_DEADLINE: "true"
          VITE_ENABLE_REWORK_HIGHLIGHT: "true"

      - name: Require production secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_URL: ${{ secrets.APP_URL }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER DEPLOY_PATH APP_URL API_URL; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set on the production GitHub Environment"
              missing=1
            fi
          done
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_KEY_B64" ]; then
            echo "::error::Set SSH_KEY_B64 (recommended) or SSH_KEY on the production Environment"
            missing=1
          fi
          exit $missing

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/deploy_key"

          # Prefer base64 secret — avoids GitHub multiline paste corruption (libcrypto)
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | tr -d ' \n\r\t' | base64 -d > "$KEY_FILE"
          else
            printenv SSH_KEY | tr -d '\r' > "$KEY_FILE"
            if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
              printenv SSH_KEY | tr -d '\r' | sed 's/\\n/\n/g' > "$KEY_FILE"
            fi
          fi

          # OpenSSH requires a trailing newline
          if [ -s "$KEY_FILE" ] && [ -n "$(tail -c1 "$KEY_FILE")" ]; then
            echo >> "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          if ! grep -q "BEGIN .*PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::Key must be a PRIVATE key (-----BEGIN ... PRIVATE KEY-----), not .pub"
            exit 1
          fi

          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::Private key is still invalid (libcrypto). Create secret SSH_KEY_B64: on A2 run  base64 -w0 ~/.ssh/Workflow  and paste that single line."
            exit 1
          fi

          echo "SSH key OK (fingerprint follows)"
          ssh-keygen -lf "$KEY_FILE" || true

          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Upload frontend + backend to A2 (keep live .env / uploads)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new"
          $SSH "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/backend' '${DEPLOY_PATH}/dist' '${DEPLOY_PATH}/backend/logs' '${DEPLOY_PATH}/backend/uploads'"

          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude logs \
            --exclude uploads \
            -e "$SSH" \
            backend/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/"

          rsync -az --delete \
            -e "$SSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/dist/"

          rsync -az \
            -e "$SSH" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

          rsync -az \
            -e "$SSH" \
            deploy/htaccess.production "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.htaccess"

          rsync -az \
            -e "$SSH" \
            deploy/remote-after-deploy.sh "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/backend/remote-after-deploy.sh"

      - name: Install dependencies and reload PM2 on A2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ env.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "PROCESS_MANAGER='${{ secrets.PROCESS_MANAGER || 'pm2' }}' \
             PM2_APP_NAME='${{ secrets.PM2_APP_NAME || 'workflow-backend' }}' \
             BOOTSTRAP_DB='false' \
             bash '${DEPLOY_PATH}/backend/remote-after-deploy.sh' '${DEPLOY_PATH}'"

      - name: Health check
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          echo "Checking ${API_URL}/health"
          curl -fsS "${API_URL}/health"
          echo
          echo "Production (A2) health check passed"
