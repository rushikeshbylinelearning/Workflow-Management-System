name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main
      - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://workflow.bylinelms.com/api
          VITE_SSO_DASHBOARD_URL: https://sso.bylinelms.com/dashboard
          VITE_ENABLE_RESUBMISSION_DEADLINE: "true"
          VITE_ENABLE_REWORK_HIGHLIGHT: "true"

  backend:
    name: Backend install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server entry
        run: node --check server.js
